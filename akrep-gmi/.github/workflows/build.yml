name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x akrep-gmi/gradlew

    - name: Build with Gradle
      run: cd akrep-gmi && ./gradlew clean assembleDebug

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: akrep-gmi/app/build/outputs/apk/debug/app-debug.apk
